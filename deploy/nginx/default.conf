map $args $boykovdocs_home_robots {
    ""      "";
    default "noindex, follow";
}

# Only the loopback-bound system nginx reaches this proxy in production.
# Preserve its verified public scheme instead of replacing HTTPS with the
# internal HTTP transport. Ignore malformed or unsupported header values.
map $http_x_forwarded_proto $boykovdocs_forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    location = / {
        try_files /index.html =404;
        add_header X-Robots-Tag $boykovdocs_home_robots always;
    }

    # ==============================
    # Backend API
    # ==============================

    location /api/ {
        proxy_pass http://api:4000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $boykovdocs_forwarded_proto;
    }


    # ==============================
    # Server-side SEO routes
    # ==============================

    location = /robots.txt {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $boykovdocs_forwarded_proto;
    }

    location = /sitemap.xml {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $boykovdocs_forwarded_proto;
    }

    location = /instrukcii-po-ohrane-truda {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $boykovdocs_forwarded_proto;
    }

    location = /instrukcii-po-ohrane-truda/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $boykovdocs_forwarded_proto;
    }

    location ^~ /instrukcii-po-ohrane-truda/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $boykovdocs_forwarded_proto;
    }

    location ^~ /instrukciya-po-ohrane-truda/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $boykovdocs_forwarded_proto;
    }

    location = /thanks {
        return 302 /thanks/;
    }

    location = /thanks/ {
        try_files /thanks/index.html =404;
        add_header Cache-Control "no-store";
    }


    # ==============================
    # React SPA: urgent generation
    # ==============================

    location = /srochnaya-generaciya-instrukcii {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location = /srochnaya-generaciya-instrukcii/ {
        return 301 /srochnaya-generaciya-instrukcii;
    }


    # ==============================
    # Static frontend
    #
    # Если файла/каталога нет —
    # отдаём запрос backend.
    # Так сохраняется настоящий 404.
    # ==============================

    location / {
        try_files $uri $uri/ @backend;
    }


    location @backend {
        proxy_pass http://api:4000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $boykovdocs_forwarded_proto;
    }
}
