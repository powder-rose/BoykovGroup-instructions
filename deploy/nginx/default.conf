server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # ==============================
    # Backend API
    # ==============================

    location /api/ {
        proxy_pass http://api:4000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ==============================
    # Server-side SEO routes
    # ==============================

    location = /robots.txt {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /instrukcii-po-ohrane-truda {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /instrukcii-po-ohrane-truda/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /instrukcii-po-ohrane-truda/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /instrukciya-po-ohrane-truda/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /thanks {
        return 302 /thanks/;
    }

    location = /thanks/ {
        try_files /thanks/index.html =404;
        add_header Cache-Control "no-store";
    }


    # ==============================
    # React SPA: urgent generation
    # ==============================

    location = /srochnaya-generaciya-instrukcii {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location = /srochnaya-generaciya-instrukcii/ {
        return 301 /srochnaya-generaciya-instrukcii;
    }


    # ==============================
    # Static frontend
    #
    # Если файла/каталога нет —
    # отдаём запрос backend.
    # Так сохраняется настоящий 404.
    # ==============================

    location / {
        try_files $uri $uri/ @backend;
    }


    location @backend {
        proxy_pass http://api:4000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
