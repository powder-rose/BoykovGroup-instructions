services:

  api:
    build:
      context: ./app/server
      dockerfile: Dockerfile

    container_name: boykovdocs-api

    restart: unless-stopped

    stop_grace_period: 20s

    env_file:
      - ./app/server/.env

    expose:
      - "4000"

    volumes:
      - ./app/server/src/data:/app/src/data
      - ./app/server/data:/app/data
      - ./app/server/uploads:/app/uploads

      # SEO renderer reads the same frontend sources and production shell
      # that are used by the public site.
      - ./app/client/src:/client/src:ro
      - ./app/client/public:/client/public:ro
      - ./app/public_html:/public_html:ro

    networks:
      - boykovdocs


  nginx:
    image: nginx:1.28-alpine

    container_name: boykovdocs-nginx

    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./app/public_html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - boykovdocs


networks:
  boykovdocs:
    name: boykovdocs-network
