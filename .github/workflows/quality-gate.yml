name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install code-style tooling
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix client

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Run source quality checks
        run: npm run quality:check

      - name: Verify homepage filter robots headers in Nginx
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f boykovdocs-nginx-test >/dev/null 2>&1 || true' EXIT

          docker run -d --name boykovdocs-nginx-test \
            --add-host api:127.0.0.1 \
            -p 127.0.0.1:18081:80 \
            --mount type=bind,source="$GITHUB_WORKSPACE/client/dist",target=/usr/share/nginx/html,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/deploy/nginx/default.conf",target=/etc/nginx/conf.d/default.conf,readonly \
            nginx:1.28-alpine
          docker exec boykovdocs-nginx-test nginx -t

          curl -fsS --retry 5 --retry-connrefused --retry-delay 1 \
            -D /tmp/boykovdocs-home-headers http://127.0.0.1:18081/ \
            -o /tmp/boykovdocs-home.html
          cmp client/dist/index.html /tmp/boykovdocs-home.html
          if grep -qi '^X-Robots-Tag:' /tmp/boykovdocs-home-headers; then
            echo 'The plain homepage must retain its indexing settings'
            exit 1
          fi
          for query in 'catalog=H01' 'catalog=H02&category=W01' 'tag=T03' 'q=test'; do
            curl -fsS -D /tmp/boykovdocs-filter-headers \
              "http://127.0.0.1:18081/?$query" -o /tmp/boykovdocs-filter.html
            grep -Eqi '^X-Robots-Tag: noindex, follow' /tmp/boykovdocs-filter-headers
            cmp client/dist/index.html /tmp/boykovdocs-filter.html
          done

      - name: Build lifecycle test image
        run: docker build -t boykovdocs-api:lifecycle-test ./server

      - name: Prepare isolated runtime
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME=/tmp/boykovdocs-lifecycle

          rm -rf "$RUNTIME"

          mkdir -p \
            "$RUNTIME/src-data" \
            "$RUNTIME/server-data" \
            "$RUNTIME/uploads"

          cp -a server/src/data/. "$RUNTIME/src-data/"

      - name: Start lifecycle test container
        shell: bash
        run: |
          set -euo pipefail

          docker run \
            -d \
            --name boykovdocs-lifecycle-test \
            -e PORT=4000 \
            -e JWT_SECRET=boykovdocs-ci-only-jwt-secret-9e8d0c6a4f2b7d31 \
            -e CLIENT_ORIGIN=http://localhost:5173 \
            -e SHUTDOWN_TIMEOUT_MS=15000 \
            -e "DAILY_GENERATION_CRON=59 23 31 12 *" \
            -e "DAILY_STATS_CRON=59 23 31 12 *" \
            -p 127.0.0.1:18080:4000 \
            --mount type=bind,source=/tmp/boykovdocs-lifecycle/src-data,target=/app/src/data \
            --mount type=bind,source=/tmp/boykovdocs-lifecycle/server-data,target=/app/data \
            --mount type=bind,source=/tmp/boykovdocs-lifecycle/uploads,target=/app/uploads \
            --mount type=bind,source="$GITHUB_WORKSPACE/client/src",target=/client/src,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/client/public",target=/client/public,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/public_html",target=/public_html,readonly \
            boykovdocs-api:lifecycle-test

      - name: Wait for API health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:18080/api/health \
              > /tmp/boykovdocs-health.json
            then
              cat /tmp/boykovdocs-health.json
              exit 0
            fi

            echo "Waiting for API: $attempt/30"
            sleep 0.5
          done

          echo "API did not become healthy"
          docker logs boykovdocs-lifecycle-test
          exit 1

      - name: Verify Node is PID 1
        shell: bash
        run: |
          set -euo pipefail

          PID1="$(
            docker exec \
              boykovdocs-lifecycle-test \
              sh -lc 'tr "\0" " " </proc/1/cmdline'
          )"

          echo "PID 1 command: $PID1"

          printf '%s\n' "$PID1" \
            | grep -Eq '^node src/index\.js( |$)'

      - name: Verify graceful SIGTERM shutdown
        shell: bash
        run: |
          set -euo pipefail

          docker stop \
            -t 20 \
            boykovdocs-lifecycle-test

          EXIT_CODE="$(
            docker inspect \
              boykovdocs-lifecycle-test \
              --format '{{.State.ExitCode}}'
          )"

          echo "ExitCode: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            docker logs boykovdocs-lifecycle-test
            exit 1
          fi

          docker logs \
            boykovdocs-lifecycle-test \
            > /tmp/boykovdocs-lifecycle.log \
            2>&1

          cat /tmp/boykovdocs-lifecycle.log

          grep \
            -F \
            "[Shutdown] SIGTERM received" \
            /tmp/boykovdocs-lifecycle.log

          grep \
            -F \
            "[Shutdown] completed" \
            /tmp/boykovdocs-lifecycle.log

      - name: Cleanup lifecycle test
        if: always()
        shell: bash
        run: |
          docker rm \
            -f \
            boykovdocs-lifecycle-test \
            2>/dev/null \
            || true

          docker image rm \
            boykovdocs-api:lifecycle-test \
            2>/dev/null \
            || true

          rm -rf \
            /tmp/boykovdocs-lifecycle
