<script type="text/javascript">
(function () {

    "use strict";

    var METRIKA_ID = 111997028;

    /*
     * ---------------------------------------------------------
     * 1. Официальный загрузчик ym
     * ---------------------------------------------------------
     */

    (function(m,e,t,r,i,k,a){

        m[i] = m[i] || function(){
            (m[i].a = m[i].a || [])
                .push(arguments);
        };

        m[i].l = 1 * new Date();

        for (
            var j = 0;
            j < document.scripts.length;
            j++
        ) {

            if (
                document.scripts[j].src === r
            ) {
                return;
            }

        }

        k = e.createElement(t);
        a = e.getElementsByTagName(t)[0];

        k.async = 1;
        k.src = r;

        a.parentNode.insertBefore(
            k,
            a
        );

    })(
        window,
        document,
        "script",
        "https://mc.yandex.ru/metrika/tag.js",
        "ym"
    );


    /*
     * ---------------------------------------------------------
     * 2. SPA tracking
     * ---------------------------------------------------------
     */

    var counterReady = false;
    var lastTrackedUrl = null;


    function currentUrl() {

        return window.location.href;

    }


    function sendPageView() {

        if (!counterReady) {
            return;
        }


        var url = currentUrl();


        /*
         * React и некоторые addon-скрипты
         * могут несколько раз вызвать replaceState.
         *
         * Один URL = один hit.
         */
        if (
            url === lastTrackedUrl
        ) {
            return;
        }


        lastTrackedUrl = url;


        window.ym(
            METRIKA_ID,
            "hit",
            url,
            {
                title:
                    document.title
            }
        );

    }


    function schedulePageView() {

        window.setTimeout(
            sendPageView,
            150
        );

    }


    /*
     * ---------------------------------------------------------
     * 3. Событие подтверждения инициализации Метрики
     * ---------------------------------------------------------
     */

    document.addEventListener(
        "yacounter" +
        METRIKA_ID +
        "inited",
        function () {

            counterReady = true;

            schedulePageView();

        }
    );


    /*
     * ---------------------------------------------------------
     * 4. Инициализация
     *
     * defer:true означает:
     * автоматический PageView при init не отправляем,
     * отправляем его сами через hit.
     * ---------------------------------------------------------
     */

    window.ym(
        METRIKA_ID,
        "init",
        {
            defer: true,
            triggerEvent: true,
            clickmap: true,
            trackLinks: true,
            accurateTrackBounce: true,
            webvisor: true
        }
    );


    /*
     * ---------------------------------------------------------
     * 5. React Router / History API
     * ---------------------------------------------------------
     */

    if (
        !window
            .__BOYKOV_METRIKA_SPA_TRACKING__
    ) {

        window
            .__BOYKOV_METRIKA_SPA_TRACKING__ =
            true;


        var originalPushState =
            history.pushState;


        var originalReplaceState =
            history.replaceState;


        history.pushState =
            function () {

                var result =
                    originalPushState
                        .apply(
                            this,
                            arguments
                        );

                window.dispatchEvent(
                    new Event(
                        "boykov:locationchange"
                    )
                );

                return result;

            };


        history.replaceState =
            function () {

                var result =
                    originalReplaceState
                        .apply(
                            this,
                            arguments
                        );

                window.dispatchEvent(
                    new Event(
                        "boykov:locationchange"
                    )
                );

                return result;

            };


        window.addEventListener(
            "popstate",
            function () {

                window.dispatchEvent(
                    new Event(
                        "boykov:locationchange"
                    )
                );

            }
        );


        window.addEventListener(
            "boykov:locationchange",
            schedulePageView
        );

    }

})();
</script>
